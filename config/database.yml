default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "e-commerce") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "e-commerce_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "e-commerce_production" } %>
  url: <%= ENV["DATABASE_URL"] %>
